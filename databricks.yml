
# ============================================================
# Databricks Asset Bundle
# Healthcare Readmission ML POC
# ============================================================
#
# Validate:
# databricks bundle validate -t dev --profile healthcare-poc
#
# Deploy:
# databricks bundle deploy -t dev --profile healthcare-poc
#
# Generate and ingest data:
# databricks bundle run setup_data -t dev --profile healthcare-poc
#
# Run training pipeline:
# databricks bundle run readmission_training_pipeline -t dev --profile healthcare-poc
#
# Run scoring pipeline:
# databricks bundle run readmission_scoring_pipeline -t dev --profile healthcare-poc

bundle:
  name: healthcare_readmission_poc

variables:
  catalog:
    description: Unity Catalog catalog for the environment
    default: health_poc_dev

  schema:
    description: Schema containing the readmission project tables
    default: readmission

  n_encounters:
    description: Number of synthetic encounters to generate
    default: "1000000"

  alert_email:
    description: Email address for job failure notifications
    default: ml-team@example.com

  git_sha:
    description: Git commit identifier for model tracking
    default: local

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: health_poc_dev
      n_encounters: "100000"

  staging:
    mode: production
    variables:
      catalog: health_poc_stg
    workspace:
      root_path: "/Workspace/Shared/.bundle/${bundle.name}/staging"

  prod:
    mode: production
    variables:
      catalog: health_poc_prod
    workspace:
      root_path: "/Workspace/Shared/.bundle/${bundle.name}/prod"
    # Configure a production service principal before enabling run_as.

resources:
  jobs:

    # ========================================================
    # JOB 1: SETUP GOVERNANCE AND GENERATE DATA
    # ========================================================
    setup_data:
      name: "[${bundle.target}] setup_governance_and_data"

      parameters:
        - name: catalog
          default: "${var.catalog}"

        - name: schema
          default: "${var.schema}"

        - name: env
          default: "${bundle.target}"

        - name: n_encounters
          default: "${var.n_encounters}"

        - name: n_patients
          default: "300000"

      tasks:
        - task_key: governance
          notebook_task:
            notebook_path: ./notebooks/00_setup_governance.py

        - task_key: generate_data
          depends_on:
            - task_key: governance
          notebook_task:
            notebook_path: ./notebooks/01_generate_synthetic_data.py

    # ========================================================
    # JOB 2: READMISSION MODEL TRAINING PIPELINE
    # ========================================================
    readmission_training_pipeline:
      name: "[${bundle.target}] readmission_training_pipeline"

      description: >
        Healthcare readmission training workflow:
        ingest, transform, feature engineering, model training,
        validation, promotion gate, deployment and batch scoring.

      parameters:
        - name: catalog
          default: "${var.catalog}"

        - name: schema
          default: "${var.schema}"

        - name: env
          default: "${bundle.target}"

        - name: git_sha
          default: "${var.git_sha}"

        - name: trigger_reason
          default: scheduled

        - name: approved
          default: "false"

      schedule:
        quartz_cron_expression: "0 0 2 1 * ?"
        timezone_id: Asia/Kolkata
        pause_status: PAUSED

      email_notifications:
        on_failure:
          - "${var.alert_email}"

      max_concurrent_runs: 1

      tasks:
        - task_key: ingest_transform
          max_retries: 1
          notebook_task:
            notebook_path: ./notebooks/02_bronze_silver_gold.py

        - task_key: features
          depends_on:
            - task_key: ingest_transform
          notebook_task:
            notebook_path: ./notebooks/04_feature_engineering.py

        - task_key: train
          depends_on:
            - task_key: features
          notebook_task:
            notebook_path: ./notebooks/05_train_and_register.py

        - task_key: validate_promote
          depends_on:
            - task_key: train
          notebook_task:
            notebook_path: ./notebooks/06_validate_and_promote.py
            base_parameters:
              approved: "{{job.parameters.approved}}"

        - task_key: promoted_gate
          depends_on:
            - task_key: validate_promote
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.validate_promote.values.promoted}}"
            right: "true"

        - task_key: deploy_endpoint
          depends_on:
            - task_key: promoted_gate
              outcome: "true"
          notebook_task:
            notebook_path: ./notebooks/08_deploy_realtime_endpoint.py

        - task_key: batch_score
          depends_on:
            - task_key: deploy_endpoint
          notebook_task:
            notebook_path: ./notebooks/07_batch_scoring.py

    # ========================================================
    # JOB 3: DAILY READMISSION SCORING PIPELINE
    # ========================================================
    readmission_scoring_pipeline:
      name: "[${bundle.target}] readmission_scoring_pipeline"

      description: >
        Daily healthcare pipeline:
        ingest, transform, feature refresh, batch scoring,
        monitoring and retraining checks.

      parameters:
        - name: catalog
          default: "${var.catalog}"

        - name: schema
          default: "${var.schema}"

        - name: env
          default: "${bundle.target}"

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: Asia/Kolkata
        pause_status: PAUSED

      email_notifications:
        on_failure:
          - "${var.alert_email}"

      tasks:
        - task_key: ingest_transform
          notebook_task:
            notebook_path: ./notebooks/02_bronze_silver_gold.py

        - task_key: features
          depends_on:
            - task_key: ingest_transform
          notebook_task:
            notebook_path: ./notebooks/04_feature_engineering.py

        - task_key: score
          depends_on:
            - task_key: features
          notebook_task:
            notebook_path: ./notebooks/07_batch_scoring.py

        - task_key: monitor
          depends_on:
            - task_key: score
          notebook_task:
            notebook_path: ./notebooks/09_monitoring.py

        - task_key: retrain_check
          depends_on:
            - task_key: monitor
          notebook_task:
            notebook_path: ./notebooks/10_retrain_trigger.py
            base_parameters:
              training_job_name: "[${bundle.target}] readmission_training_pipeline"
